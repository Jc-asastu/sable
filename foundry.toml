[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20000
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]

fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 120
