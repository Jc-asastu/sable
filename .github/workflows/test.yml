name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Format
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Unit, fuzz and invariant tests
        run: forge test -vvv

      - name: Gas report
        run: forge test --gas-report --nmc Invariant | tee gas-report.txt

      - name: Monad mainnet fork tests
        if: ${{ vars.MONAD_RPC_URL != '' }}
        env:
          MONAD_RPC_URL: ${{ vars.MONAD_RPC_URL }}
        run: forge test --mc MonadFork -vv

      - uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: gas-report.txt

  node:
    name: Node
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install keeper dependencies
        run: npm ci --prefix keeper --ignore-scripts

      - name: Test keeper
        run: npm test --prefix keeper

      - name: Install monitor dependencies
        run: npm ci --prefix monitor --ignore-scripts

      - name: Test monitor
        run: npm test --prefix monitor

      - name: Test fixture CLI
        run: node --test scripts/kyber-fixture.test.mjs
